const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const idb = () => new Promise((ok, no) => { const r = indexedDB.open('painel', 1); r.onupgradeneeded = () => r.result.createObjectStore('k'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
const kget = async () => { try { const d = await idb(); return await new Promise(ok => { const q = d.transaction('k').objectStore('k').get('key'); q.onsuccess = () => ok(q.result); q.onerror = () => ok(null); }); } catch (e) { return null; } };
const kset = async key => { try { const d = await idb(); d.transaction('k', 'readwrite').objectStore('k').put(key, 'key'); } catch (e) {} };
const kdel = async () => { try { const d = await idb(); d.transaction('k', 'readwrite').objectStore('k').delete('key'); } catch (e) {} };
const derive = async pw => {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(B.salt), iterations: B.iter, hash: 'SHA-256'}, km, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
};
const decrypt = async key => new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(B.iv)}, key, b64(B.ct)));
const show = html => { document.open(); document.write(html); document.close(); };
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault(); const btn = document.getElementById('b'); btn.disabled = true; btn.textContent = 'Abrindo...';
  try { const key = await derive(document.getElementById('p').value); const html = await decrypt(key);
    if (document.getElementById('r').checked) await kset(key); show(html);
  } catch (err) { document.getElementById('e').textContent = 'Senha incorreta.'; btn.disabled = false; btn.textContent = 'Abrir'; await kdel(); }
});
(async () => { const key = await kget(); if (key) { try { show(await decrypt(key)); } catch (e) { await kdel(); } } })();
